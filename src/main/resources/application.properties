spring.application.name=ShopNamTrung

# SQL Server - tái sử dụng database BaiTap hiện có
spring.datasource.url=jdbc:sqlserver://localhost:1433;instanceName=SQLEXPRESS;databaseName=BaiTap;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=namtrung8312
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Database BaiTap đã có sẵn bảng/constraint; không để Hibernate tự ALTER/CREATE lại.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JSP/JSTL
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Project có sẵn dependency Thymeleaf nhưng bài này dùng JSP/JSTL.
# Tắt Thymeleaf để nó không giành xử lý các view admin/category/... và admin/user/...
spring.thymeleaf.enabled=false
spring.thymeleaf.check-template-location=false

# Bắt buộc UTF-8 để tiếng Việt không bị đổi thành dấu ?
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8
spring.messages.encoding=UTF-8

# Upload ảnh Category và Product từ máy
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# File thật được lưu tại E:/upload/category và E:/upload/product.
# Database chỉ lưu đường dẫn tương đối category/... hoặc product/...
app.upload-dir=E:/upload
